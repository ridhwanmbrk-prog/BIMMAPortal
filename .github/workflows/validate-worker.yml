name: Validate BIMMAPortal

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/cloudflare-d1-foundation"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
